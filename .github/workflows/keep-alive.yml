name: Supabase Keep Alive

on:
  schedule:
    # Se ejecuta cada 3 días a las 5:00 UTC
    - cron: '0 5 */3 * *'
  workflow_dispatch: # Permite la ejecución manual desde la UI de GitHub

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Realizar consulta de actividad a Supabase
        run: |
          curl -f -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/documents?limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
          echo "Petición realizada con éxito a Supabase."
